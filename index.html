<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>نقاشی قدم به قدم</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7ff;
      color: #222;
    }

    header {
      background: #6c63ff;
      color: white;
      text-align: center;
      padding: 28px 15px;
      border-radius: 0 0 30px 30px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 10px 0 0;
      font-size: 17px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px;
    }

    .title {
      text-align: center;
      margin-bottom: 25px;
      font-size: 22px;
    }

    .drawings {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 22px 10px;
      text-align: center;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: 0.2s;
      user-select: none;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    .card:active {
      transform: scale(0.96);
    }

    .emoji {
      font-size: 65px;
    }

    .card h3 {
      margin: 12px 0 0;
      font-size: 19px;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #777;
    }

  </style>
</head>

<body>

  <header>

    <h1>🎨 نقاشی قدم به قدم</h1>

    <p>
      با هم نقاشی‌های زیبا بکشیم!
    </p>

  </header>


  <main class="container">

    <h2 class="title">
      👇 یک نقاشی انتخاب کن
    </h2>


    <div class="drawings">


      <!-- گربه -->

      <div class="card" onclick="openDrawing('cat')">

        <div class="emoji">
          🐱
        </div>

        <h3>
          گربه
        </h3>

      </div>


      <!-- سگ -->

      <div class="card" onclick="openDrawing('dog')">

        <div class="emoji">
          🐶
        </div>

        <h3>
          سگ
        </h3>

      </div>


      <!-- ماشین -->

      <div class="card" onclick="openDrawing('car')">

        <div class="emoji">
          🚗
        </div>

        <h3>
          ماشین
        </h3>

      </div>


      <!-- خانه -->

      <div class="card" onclick="openDrawing('house')">

        <div class="emoji">
          🏠
        </div>

        <h3>
          خانه
        </h3>

      </div>


      <!-- درخت -->

      <div class="card" onclick="openDrawing('tree')">

        <div class="emoji">
          🌳
        </div>

        <h3>
          درخت
        </h3>

      </div>


      <!-- ماهی -->

      <div class="card" onclick="openDrawing('fish')">

        <div class="emoji">
          🐟
        </div>

        <h3>
          ماهی
        </h3>

      </div>


    </div>

  </main>


  <footer>

    🎨 ساخته شده برای یادگیری و سرگرمی کودکان ❤️

  </footer>


  <script>

    function openDrawing(type) {

      window.location.href =
        "drawing.html?type=" + type;

    }

  </script>


</body>

</html>
